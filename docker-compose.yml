services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env to your Aiven PostgreSQL connection URL}"
      PGSSLROOTCERT: /run/secrets/aiven-ca.pem
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./ca.pem:/run/secrets/aiven-ca.pem:ro
    command: sh -c "npm run db:setup && npm start"

  restore-db:
    image: postgres:18-alpine
    profiles:
      - restore
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env to your Aiven PostgreSQL connection URL}"
      PGSSLROOTCERT: /run/secrets/aiven-ca.pem
      PGSSLMODE: verify-full
    volumes:
      - ./movies_dump.sql:/movies_dump.sql:ro
      - ./ca.pem:/run/secrets/aiven-ca.pem:ro
    entrypoint: ["sh", "-c"]
    command: "sed -e '/^ALTER TABLE .* OWNER TO postgres;$/d' -e '/^SET transaction_timeout = 0;$/d' /movies_dump.sql | psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1"
